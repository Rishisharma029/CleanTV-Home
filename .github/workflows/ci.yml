name: CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  validate-scripts:
    name: Validate Scripts & Presets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Pre-compiled APK Hashes
        run: |
          echo "Verifying APK integrity..."
          sha256sum apks/*.apk

      - name: Validate Debloat Presets Syntax
        run: |
          echo "Validating presets..."
          for preset in presets/*.txt; do
            echo "Checking $preset..."
            test -s "$preset" || exit 1
          done

      - name: Shellcheck Installer Scripts
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -s bash install.sh restore.sh tools/get-adb.sh
          fi

  android-build:
    name: Build & Verify Android TV Launcher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: |
          find . -name "gradlew" -exec chmod +x {} + || true

      - name: Build Launcher APK
        working-directory: baron-inspired-tv-home-codebase/launcher
        run: |
          ./gradlew assembleDebug --no-daemon -q

      - name: Verify Generated Output
        run: |
          find baron-inspired-tv-home-codebase/launcher/app/build/outputs/apk/ -name "*.apk" | grep -q "apk"

  security-scan:
    name: Security & Permissions Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan AndroidManifest for Excessive Permissions
        run: |
          MANIFEST="baron-inspired-tv-home-codebase/launcher/app/src/main/AndroidManifest.xml"
          echo "Checking permissions in $MANIFEST..."
          grep "uses-permission" "$MANIFEST" || true
